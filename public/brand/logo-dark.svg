<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 44" fill="none"
     role="img" aria-label="Zinoit Tech">
  <defs>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#ff5542"/>
      <stop offset="45%"  stop-color="#ff7a5c"/>
      <stop offset="100%" stop-color="#ffb8a8"/>
    </linearGradient>
  </defs>
  <!--
    Font: Circular Std / Avenir Next / Nunito (fallback)
    Dark variant — "tech" uses #64748B for dark backgrounds
  -->
  <text x="0" y="32"
    font-family="'Circular Std', 'Circular', 'Avenir Next', 'Avenir', 'Nunito', system-ui, sans-serif"
    font-size="30">
    <tspan font-weight="800" fill="url(#coral)">zinoit</tspan><tspan font-weight="300" fill="#64748B">tech</tspan>
  </text>
</svg>
