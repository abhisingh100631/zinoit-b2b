<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  Zinoit Tech LLC — browser tab favicon (32 × 32)        ║
    ╠══════════════════════════════════════════════════════════╣
    ║  Hourglass Z on navy rounded background.                 ║
    ║  Optimised for small render sizes (16 px @ 2×, 32 px).  ║
    ║                                                          ║
    ║  Waist = 4 px at midpoint y=16 for clarity at 16 px.   ║
    ║  Bars: 3.5 px.  Diagonal ends: 7 px.                   ║
    ╚══════════════════════════════════════════════════════════╝
  -->

  <!-- Navy background -->
  <rect width="32" height="32" rx="7" fill="#0B1F3A"/>

  <!--
    White Z mark (x = 3..29, y = 4..28 — 3 px padding each edge).

    Top bar:    x=3..29, y=4..7.5
    Bottom bar: x=3..29, y=24.5..28

    Diagonal:
      y=7.5   → 7 px wide: x 22..29  (right portion)
      y=16    → 4 px wide: x 14..18  (waist, geometric centre)
      y=24.5  → 7 px wide: x 3..10   (left portion)

    Waist centre: (25.5+6.5)/2 = 16 ← matches y=16 ✓
  -->

  <!-- Top bar -->
  <rect x="3" y="4" width="26" height="3.5" fill="white"/>

  <!-- Tapered diagonal -->
  <polygon
    points="22,7.5  29,7.5  18,16  10,24.5  3,24.5  14,16"
    fill="white"/>

  <!-- Bottom bar -->
  <rect x="3" y="24.5" width="26" height="3.5" fill="white"/>

</svg>
